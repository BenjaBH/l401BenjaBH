<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="refresh" content="2"></meta>
	<style>
		#tabla{border-collapse:collapse;}
		#c00,#c01,#c02,#c03,
		#c10,#c11,#c12,#c13,
		#c20,#c21,#c22,#c23,
		#c30,#c31,#c32,#c33{
			width:80px;
			height:80px;
			border:1px solid black;
			text-align:center;
			background-color:gray;
		}
		#c00{background-color:{% if colX == 0 and filY == 0 %}red;{% else %}gray;{% endif %}}
		#c01{background-color:{% if colX == 1 and filY == 0 %}red;{% else %}gray;{% endif %}}
		#c02{background-color:{% if colX == 2 and filY == 0 %}red;{% else %}gray;{% endif %}}
		#c03{background-color:{% if colX == 3 and filY == 0 %}red;{% else %}gray;{% endif %}}
		#c10{background-color:{% if colX == 0 and filY == 1 %}red;{% else %}gray;{% endif %}}
		#c11{background-color:{% if colX == 1 and filY == 1 %}red;{% else %}gray;{% endif %}}
		#c12{background-color:{% if colX == 2 and filY == 1 %}red;{% else %}gray;{% endif %}}
		#c13{background-color:{% if colX == 3 and filY == 1 %}red;{% else %}gray;{% endif %}}
		#c20{background-color:{% if colX == 0 and filY == 2 %}red;{% else %}gray;{% endif %}}
		#c21{background-color:{% if colX == 1 and filY == 2 %}red;{% else %}gray;{% endif %}}
		#c22{background-color:{% if colX == 2 and filY == 2 %}red;{% else %}gray;{% endif %}}
		#c23{background-color:{% if colX == 3 and filY == 2 %}red;{% else %}gray;{% endif %}}
		#c30{background-color:{% if colX == 0 and filY == 3 %}red;{% else %}gray;{% endif %}}
		#c31{background-color:{% if colX == 1 and filY == 3 %}red;{% else %}gray;{% endif %}}
		#c32{background-color:{% if colX == 2 and filY == 3 %}red;{% else %}gray;{% endif %}}
		#c33{background-color:{% if colX == 3 and filY == 3 %}red;{% else %}gray;{% endif %}}
		#titulo{color:red;}
		#nombre{color:darkred;}
		#explicacion{width:400px;}
	</style>
</head>
<body>
	<h1 id="titulo">Visualización de Datos X-Y</h1>
	<h2 id="nombre">Benjamín Badilla</h2>
	<p id="explicacion">Los datos X e Y vienen desde la aplicación móvil. La celda activa se ilumina en rojo según la posición del dispositivo en la grilla 4x4.</p>
	<p>X = {{ ejeY }}</p>
	<p>Y = {{ ejeX }}</p>
	<table id="tabla">
		<tr><td id="c00"></td><td id="c01"></td><td id="c02"></td><td id="c03"></td></tr>
		<tr><td id="c10"></td><td id="c11"></td><td id="c12"></td><td id="c13"></td></tr>
		<tr><td id="c20"></td><td id="c21"></td><td id="c22"></td><td id="c23"></td></tr>
		<tr><td id="c30"></td><td id="c31"></td><td id="c32"></td><td id="c33"></td></tr>
	</table>
</body>
</html>
